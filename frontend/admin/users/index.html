<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <title>Users — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../global.css"/>
  <link rel="stylesheet" href="../admin.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous"/>
</head>
<body>

<aside class="admin-sidebar">
  <div class="admin-logo">
   <!-- <span class="admin-logo-mark">B</span>-->
    <div>
      <span class="admin-logo-text">biggs <span>fitness</span></span>
      <span class="admin-badge">Admin</span>
    </div>
  </div>
  <nav class="admin-nav">
    <a href="../index.html"   class="admin-nav-item"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
    <a href="../coaches/index.html" class="admin-nav-item"><i class="fa-solid fa-user-tie"></i><span>Coaches</span></a>
    <a href="../users/index.html"   class="admin-nav-item active"><i class="fa-solid fa-users"></i><span>Users</span></a>
    <a href="../logs.html"    class="admin-nav-item"><i class="fa-solid fa-triangle-exclamation"></i><span>Error Logs</span></a>
  </nav>
  <div class="admin-sidebar-bottom">
    <a href="../../dashboard/index.html" class="admin-nav-item"><i class="fa-solid fa-arrow-left"></i><span>Back to App</span></a>
    <button class="admin-nav-item admin-logout" id="adminLogout"><i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span></button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-topbar">
    <div>
      <p class="admin-topbar-sub">Manage</p>
      <h2>Users</h2>
    </div>
    <div class="admin-topbar-right">
      <div class="admin-filter-group">
        <select id="planFilter" onchange="filterUsers()" class="admin-select">
          <option value="all">All Plans</option>
          <option value="starter">Starter</option>
          <option value="pro">Pro</option>
          <option value="elite">Elite</option>
        </select>
      </div>
    </div>
  </header>

  <div class="admin-content">
    <div class="admin-table-card">
      <div class="admin-table-header">
        <h3>All Users <span class="admin-count" id="userCount"></span></h3>
        <input type="text" class="admin-search" id="userSearch" placeholder="Search by name..." oninput="filterUsers()"/>
      </div>
      <table class="admin-table">
        <thead>
          <tr><th>Name</th><th>Level</th><th>Goal</th><th>Plan</th><th>Sessions</th><th>Streak</th><th>Joined</th><th>Actions</th></tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="8" class="admin-loading">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- User detail modal -->
<div class="admin-modal-overlay" id="userModalOverlay" onclick="closeUserModal()">
  <div class="admin-modal" onclick="event.stopPropagation()">
    <div class="admin-modal-header">
      <h3>User Details</h3>
      <button class="admin-modal-close" onclick="closeUserModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="userModalContent" class="admin-user-detail"></div>

    <!-- upgrade plan -->
    <div class="admin-modal-actions" style="margin-top:2.4rem;border-top:1px solid rgba(255,255,255,0.07);padding-top:2rem;">
      <label style="font-size:1.3rem;color:rgba(240,237,232,0.45);font-weight:500;">Override Plan:</label>
      <select id="planOverride" class="admin-select">
        <option value="starter">Starter</option>
        <option value="pro">Pro</option>
        <option value="elite">Elite</option>
      </select>
      <button class="btn" id="savePlanBtn" onclick="savePlanOverride()">Save Plan</button>
      <button class="btn-outline" onclick="closeUserModal()">Close</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="../form/supabase/supabase.js"></script>
<script src="./admin.js"></script>
<script>
let allUsers       = [];
let selectedUserId = null;

async function loadUsers() {
  if (!await checkAdmin()) return;

  const [profilesRes, progressRes] = await Promise.all([
    sb.from("profiles").select("*").order("created_at", { ascending: false }),
    sb.from("progress").select("user_id, total_sessions, streak")
  ]);

  const profiles = profilesRes.data || [];
  const progress = progressRes.data || [];

  const progressMap = {};
  progress.forEach(p => { progressMap[p.user_id] = p; });

  allUsers = profiles.map(p => ({
    ...p,
    sessions: progressMap[p.user_id]?.total_sessions || 0,
    streak:   progressMap[p.user_id]?.streak || 0,
  }));

  document.getElementById("userCount").textContent = `(${allUsers.length})`;
  renderUsers(allUsers);
}

function renderUsers(users) {
  const tbody = document.getElementById("usersBody");
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="8" class="admin-empty">No users found.</td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td>
        <div class="admin-coach-cell">
          <div class="admin-user-avatar">${getInitials(u.full_name || "?")}</div>
          <span>${u.full_name || "Unknown"}</span>
        </div>
      </td>
      <td class="admin-muted">${u.fitness_level || "—"}</td>
      <td class="admin-muted">${u.goal || "—"}</td>
      <td><span class="admin-plan-badge plan-${u.plan || 'starter'}">${u.plan || "starter"}</span></td>
      <td>${u.sessions}</td>
      <td>${u.streak} 🔥</td>
      <td>${new Date(u.created_at).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" })}</td>
      <td>
        <button class="admin-btn-icon edit" onclick="openUserModal('${u.user_id}')" title="View"><i class="fa-solid fa-eye"></i></button>
      </td>
    </tr>
  `).join("");
}

function filterUsers() {
  const q    = document.getElementById("userSearch").value.toLowerCase();
  const plan = document.getElementById("planFilter").value;
  renderUsers(allUsers.filter(u => {
    const matchName = !q || (u.full_name || "").toLowerCase().includes(q);
    const matchPlan = plan === "all" || (u.plan || "starter") === plan;
    return matchName && matchPlan;
  }));
}

function openUserModal(userId) {
  selectedUserId = userId;
  const u = allUsers.find(x => x.user_id === userId);
  if (!u) return;

  document.getElementById("planOverride").value = u.plan || "starter";

  document.getElementById("userModalContent").innerHTML = `
    <div class="admin-user-detail-grid">
      <div class="admin-user-detail-avatar">${getInitials(u.full_name || "?")}</div>
      <div>
        <h3 style="font-size:2rem;color:#f0ede8;">${u.full_name || "Unknown"}</h3>
        <p style="font-size:1.3rem;color:rgba(240,237,232,0.4);">User ID: ${u.user_id}</p>
      </div>
    </div>
    <div class="admin-user-detail-stats">
      ${[
        ["Fitness Level", u.fitness_level || "—"],
        ["Goal",          u.goal          || "—"],
        ["Equipment",     u.equipment     || "—"],
        ["Days/Week",     u.days_per_week || "—"],
        ["Plan",          u.plan          || "starter"],
        ["Total Sessions",u.sessions],
        ["Streak",        u.streak + " days 🔥"],
        ["Joined",        new Date(u.created_at).toLocaleDateString("en-GB", { day:"numeric", month:"long", year:"numeric" })],
        ["Plan Expires",  u.plan_expires_at ? new Date(u.plan_expires_at).toLocaleDateString("en-GB") : "—"],
      ].map(([label, val]) => `
        <div class="admin-detail-row">
          <span class="admin-detail-label">${label}</span>
          <span class="admin-detail-val">${val}</span>
        </div>
      `).join("")}
    </div>
  `;

  document.getElementById("userModalOverlay").classList.add("open");
}

function closeUserModal() {
  document.getElementById("userModalOverlay").classList.remove("open");
  selectedUserId = null;
}

async function savePlanOverride() {
  if (!selectedUserId) return;
  const plan    = document.getElementById("planOverride").value;
  const btn     = document.getElementById("savePlanBtn");
  btn.textContent = "Saving...";
  btn.disabled    = true;

  const expires = new Date();
  expires.setFullYear(plan === "starter" ? 2099 : expires.getFullYear() + 1);

  await sb.from("profiles").update({
    plan,
    plan_expires_at: plan === "starter" ? null : expires.toISOString()
  }).eq("user_id", selectedUserId);

  // update local
  const u = allUsers.find(x => x.user_id === selectedUserId);
  if (u) u.plan = plan;

  btn.textContent = "Saved ✓";
  setTimeout(() => {
    btn.textContent = "Save Plan";
    btn.disabled    = false;
    closeUserModal();
    renderUsers(allUsers);
  }, 1000);
}

function getInitials(name) {
  return name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
}

loadUsers();
</script>
</body>
</html>
