<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- fonts, icons and css links-->
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
     crossorigin="anonymous" 
     referrerpolicy="no-referrer" 
     />
    <link rel="stylesheet" href="./login.css" />
    <!--title-->
    <title>login - biggs fitness</title>
</head>
<body>

<div class="scene">
    <!-- blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="grid"></div>

    <!-- floating stat cards -->
    <div class="float-card fc-1">
        <div class="icon" style="background:rgba(249,115,22,0.15); color:#f97316;">
            <i class="fa-solid fa-fire"></i>
        </div>
        <div>
            <div class="label">Calories burned</div>
            <div class="value">2,840 kcal</div>
        </div>
    </div>

    <div class="float-card fc-2">
        <div class="icon" style="background:rgba(34,197,94,0.12); color:#22c55e;">
            <i class="fa-solid fa-check"></i>
        </div>
        <div>
            <div class="label">Workouts this week</div>
            <div class="value">4 / 5 done</div>
        </div>
    </div>

    <div class="float-card fc-3">
        <div class="icon" style="background:rgba(124,58,237,0.15); color:#a78bfa;">
            <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
            <div class="label">Current streak</div>
            <div class="value">12 days 🔥</div>
        </div>
    </div>

    <div class="float-card fc-4">
        <div class="icon" style="background:rgba(56,189,248,0.12); color:#38bdf8;">
            <i class="fa-solid fa-person-running"></i>
        </div>
        <div>
            <div class="label">AI plan ready</div>
            <div class="value">Push Day →</div>
        </div>
    </div>

    <!-- main card -->
    <div class="card">
        <div class="logo-row">
            <div class="logo-text">biggs <span>fitness</span></div>
        </div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Pick up where you left off. Your gains are waiting.</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label>Email address</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
                </div>
            </div>

            <div class="field">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
                    <button type="button" class="eye-toggle" id="eyeToggle" aria-label="Toggle password">
                      <!--<i class="fa-regular fa-eye" id="eyeIcon"></i>-->  
                    </button>
                </div>
            </div>

            <div class="forgot"><a href="#">Forgot password?</a></div>

            <button type="submit" class="btn-primary" id="loginBtn">
                LOG IN
            </button>
        </form>

        <div class="divider">or continue with</div>

        <button class="btn-google" id="googleBtn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
        </button>

        <p class="footer-text">Don't have an account? <a href="../signup/index.html">Sign up free</a></p>
    </div>
</div>

<div id="toast">
    <div class="dot"></div>
    <span id="toastMsg"></span>
</div>

<script>
    // password toggle
    const eyeToggle = document.getElementById('eyeToggle');
    const eyeIcon = document.getElementById('eyeIcon');
    const pwInput = document.getElementById('password');
    eyeToggle.addEventListener('click', () => {
        const show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        eyeIcon.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });

    // toast helper
    function showToast(msg, type = 'error') {
        const toast = document.getElementById('toast');
        toast.className = 'show ' + type;
        document.getElementById('toastMsg').textContent = msg;
        setTimeout(() => toast.className = '', 3500);
    }
</script>
<!--new supabase key-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="../supabase/supabase.js"></script>
<script src="../auth/auth.js"></script>
</body>
</html>
