<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <title>Error Logs — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../global.css"/>
  <link rel="stylesheet" href="./admin.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous"/>
</head>
<body>

<aside class="admin-sidebar">
  <div class="admin-logo">
    <!--<span class="admin-logo-mark">B</span>-->
    <div>
      <span class="admin-logo-text">biggs <span>fitness</span></span>
      <span class="admin-badge">Admin</span>
    </div>
  </div>
  <nav class="admin-nav">
    <a href="./index.html"   class="admin-nav-item"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
    <a href="../admin/coaches.html" class="admin-nav-item"><i class="fa-solid fa-user-tie"></i><span>Coaches</span></a>
    <a href="../admin/users/index.html"   class="admin-nav-item"><i class="fa-solid fa-users"></i><span>Users</span></a>
    <a href="./logs.html"    class="admin-nav-item active"><i class="fa-solid fa-triangle-exclamation"></i><span>Error Logs</span></a>
  </nav>
  <div class="admin-sidebar-bottom">
    <a href="../dashboard/index.html" class="admin-nav-item"><i class="fa-solid fa-arrow-left"></i><span>Back to App</span></a>
    <button class="admin-nav-item admin-logout" id="adminLogout"><i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span></button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-topbar">
    <div>
      <p class="admin-topbar-sub">Monitor</p>
      <h2>Error Logs</h2>
    </div>
    <div class="admin-topbar-right">
      <button class="btn-outline" onclick="clearLogs()"><i class="fa-solid fa-trash"></i> Clear Logs</button>
      <button class="btn" onclick="loadLogs()"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </div>
  </header>

  <div class="admin-content">

    <!-- summary cards -->
    <div class="admin-stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="admin-stat-card">
        <div class="admin-stat-icon" style="background:rgba(255,44,44,0.12);color:#ff2c2c"><i class="fa-solid fa-circle-xmark"></i></div>
        <div><p class="admin-stat-label">Total Errors</p><p class="admin-stat-val" id="logTotal">—</p></div>
      </div>
      <div class="admin-stat-card">
        <div class="admin-stat-icon" style="background:rgba(249,115,22,0.12);color:#f97316"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div><p class="admin-stat-label">Last 24 Hours</p><p class="admin-stat-val" id="logToday">—</p></div>
      </div>
      <div class="admin-stat-card">
        <div class="admin-stat-icon" style="background:rgba(56,189,248,0.12);color:#38bdf8"><i class="fa-solid fa-bug"></i></div>
        <div><p class="admin-stat-label">Most Common</p><p class="admin-stat-val" id="logCommon" style="font-size:1.4rem">—</p></div>
      </div>
    </div>

    <div class="admin-table-card">
      <div class="admin-table-header">
        <h3>Log Entries</h3>
        <div style="display:flex;gap:1rem;align-items:center;">
          <select class="admin-select" id="logTypeFilter" onchange="filterLogs()">
            <option value="all">All Types</option>
            <option value="error">Error</option>
            <option value="warn">Warning</option>
            <option value="info">Info</option>
          </select>
          <input type="text" class="admin-search" id="logSearch" placeholder="Search logs..." oninput="filterLogs()"/>
        </div>
      </div>
      <div id="logsContainer">
        <p class="admin-loading" style="padding:3.2rem;text-align:center;">Loading logs...</p>
      </div>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="../form/supabase/supabase.js"></script>
<script src="./admin.js"></script>
<script>
/* Logs are stored in localStorage under "bf_admin_logs"
   The logError() function in admin.js writes to it from anywhere in the app */

let allLogs = [];

async function loadLogs() {
  if (!await checkAdmin()) return;

  // read from localStorage
  const stored = localStorage.getItem("bf_admin_logs");
  allLogs = stored ? JSON.parse(stored) : [];

  // also try to read from Supabase error_logs table if it exists
  try {
    const { data } = await sb.from("error_logs").select("*").order("created_at", { ascending: false }).limit(200);
    if (data && data.length > 0) {
      allLogs = [...data.map(d => ({
        id:      d.id,
        type:    d.type || "error",
        message: d.message,
        source:  d.source,
        time:    d.created_at,
      })), ...allLogs];
    }
  } catch { /* table may not exist yet — that's fine */ }

  allLogs.sort((a, b) => new Date(b.time) - new Date(a.time));

  // stats
  const now24 = new Date(Date.now() - 86400000);
  const todayLogs = allLogs.filter(l => new Date(l.time) >= now24);

  document.getElementById("logTotal").textContent = allLogs.length;
  document.getElementById("logToday").textContent = todayLogs.length;

  // most common error
  const counts = {};
  allLogs.forEach(l => {
    const key = (l.message || "unknown").slice(0, 40);
    counts[key] = (counts[key] || 0) + 1;
  });
  const topEntry = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  document.getElementById("logCommon").textContent = topEntry ? `${topEntry[0]}... (${topEntry[1]}×)` : "—";

  renderLogs(allLogs);
}

function renderLogs(logs) {
  const container = document.getElementById("logsContainer");
  if (!logs.length) {
    container.innerHTML = `
      <div style="padding:5.6rem 2rem;text-align:center;">
        <div style="font-size:4.8rem;margin-bottom:1.6rem;"><i class="fa-solid fa-circle-check" style="font-size:4.8rem; margin-bottom:1.6rem; color:#22c55e;"></i></div>
        <p style="color:rgba(240,237,232,0.45);font-size:1.4rem;">No errors logged. Everything looks clean.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="logs-list">
      ${logs.map(l => `
        <div class="log-entry log-${l.type || 'error'}">
          <div class="log-left">
            <span class="log-type-badge ${l.type || 'error'}">${(l.type || 'error').toUpperCase()}</span>
            <div>
              <p class="log-message">${l.message || "Unknown error"}</p>
              ${l.source ? `<p class="log-source">${l.source}</p>` : ""}
              ${l.stack  ? `<pre class="log-stack">${l.stack}</pre>` : ""}
            </div>
          </div>
          <span class="log-time">${new Date(l.time).toLocaleString("en-GB", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" })}</span>
        </div>
      `).join("")}
    </div>
  `;
}

function filterLogs() {
  const q    = document.getElementById("logSearch").value.toLowerCase();
  const type = document.getElementById("logTypeFilter").value;
  renderLogs(allLogs.filter(l => {
    const matchType = type === "all" || (l.type || "error") === type;
    const matchQ    = !q || (l.message || "").toLowerCase().includes(q) || (l.source || "").toLowerCase().includes(q);
    return matchType && matchQ;
  }));
}

function clearLogs() {
  if (!confirm("Clear all local logs? This cannot be undone.")) return;
  localStorage.removeItem("bf_admin_logs");
  allLogs = [];
  renderLogs([]);
  document.getElementById("logTotal").textContent = 0;
  document.getElementById("logToday").textContent = 0;
}

loadLogs();
</script>
</body>
</html>
