<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>Progress - biggs fitness</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../global.css" />
  <link rel="stylesheet" href="../../dashboard/dashboard.css" />
  <link rel="stylesheet" href="./progress.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff2c2c" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- Apple / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="biggs fitness" />
  <link rel="apple-touch-icon" href="/frontend/assets/icons/icon-192.png" />
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <!--<span class="logo-mark">B</span>-->
      <span class="logo-label">biggs <span>fitness</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="../../dashboard/index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
      <a href="../plan/index.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>My Plans</span></a>
      <a href="../workout/index.html" class="nav-item"><i class="fa-solid fa-dumbbell"></i><span>Workout</span></a>
      <a href="../quick-suggestion/index.html" class="nav-item"><i class="fa-solid fa-bolt"></i><span>Quick Session</span></a>
      <a href="../progress/index.html" class="nav-item active"><i class="fa-solid fa-chart-line"></i><span>Progress</span></a>
                  <a href="../coaches/index.html" class="nav-item"><i class="fa-solid fa-user-tie"></i><span>Coaches</span></a>
      <a href="../profile/index.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
      <a href="../../admin/index.html" class="nav-item" id="adminNavItem" style="display:none;">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Admin</span>
      </a>
    </nav>
    <button class="sidebar-logout" id="logoutBtn">
      <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Log Out</span>
    </button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <div>
          <p class="topbar-greeting">Keep pushing</p>
          <h2 class="topbar-name">My Progress</h2>
        </div>
      </div>
      <a href="../profile/index.html" class="topbar-avatar" id="topbarAvatar"></a>
    </header>

    <div class="page-content">

      <!-- stat cards -->
      <div class="progress-stat-grid">
        <div class="progress-stat-card">
          <div class="pstat-icon" style="background:rgba(249,115,22,0.12);color:#f97316;">
            <i class="fa-solid fa-fire"></i>
          </div>
          <div>
            <p class="pstat-label">Current Streak</p>
            <p class="pstat-val" id="statStreak">—</p>
          </div>
        </div>
        <div class="progress-stat-card">
          <div class="pstat-icon" style="background:rgba(99,102,241,0.12);color:#818cf8;">
            <i class="fa-solid fa-trophy"></i>
          </div>
          <div>
            <p class="pstat-label">Longest Streak</p>
            <p class="pstat-val" id="statLongestStreak">—</p>
          </div>
        </div>
        <div class="progress-stat-card">
          <div class="pstat-icon" style="background:rgba(34,197,94,0.12);color:#22c55e;">
            <i class="fa-solid fa-check"></i>
          </div>
          <div>
            <p class="pstat-label">Total Sessions</p>
            <p class="pstat-val" id="statTotalSessions">—</p>
          </div>
        </div>
        <div class="progress-stat-card">
          <div class="pstat-icon" style="background:rgba(56,189,248,0.12);color:#38bdf8;">
            <i class="fa-solid fa-clock"></i>
          </div>
          <div>
            <p class="pstat-label">Total Mins</p>
            <p class="pstat-val" id="statTotalMins">—</p>
          </div>
        </div>
        <div class="progress-stat-card">
          <div class="pstat-icon" style="background:rgba(255,44,44,0.12);color:#ff2c2c;">
            <i class="fa-solid fa-bolt"></i>
          </div>
          <div>
            <p class="pstat-label">Calories Burned</p>
            <p class="pstat-val" id="statTotalCalories">—</p>
          </div>
        </div>
        <div class="progress-stat-card">
          <div class="pstat-icon" style="background:rgba(251,146,60,0.12);color:#fb923c;">
            <i class="fa-solid fa-calendar-week"></i>
          </div>
          <div>
            <p class="pstat-label">This Week</p>
            <p class="pstat-val" id="statThisWeek">—</p>
          </div>
        </div>
      </div>

      <!-- session history -->
      <section class="history-section">
        <div class="history-header">
          <h3>Session History</h3>
          <p class="history-sub" id="statMostTrained"></p>
        </div>
        <div id="sessionHistory" class="session-history"></div>
      </section>

    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="../../form/supabase/supabase.js"></script>
  <script src="./progress.js"></script>
</body>
</html>
