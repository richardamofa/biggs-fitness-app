<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <title>Profile — biggs fitness</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../global.css" />
  <link rel="stylesheet" href="../../dashboard/dashboard.css" />
  <link rel="stylesheet" href="./profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff2c2c" />
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- Apple / iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="biggs fitness" />
  <link rel="apple-touch-icon" href="/frontend/assets/icons/icon-192.png" />
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <!--<span class="logo-mark">B</span>-->
      <span class="logo-label">biggs <span>fitness</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="../../dashboard/index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
      <a href="../plan/index.html" class="nav-item"><i class="fa-solid fa-calendar-days"></i><span>My Plans</span></a>
      <a href="../workout/index.html" class="nav-item"><i class="fa-solid fa-dumbbell"></i><span>Workout</span></a>
      <a href="../quick-suggestion/index.html" class="nav-item"><i class="fa-solid fa-bolt"></i><span>Quick Session</span></a>
      <a href="../progress/index.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Progress</span></a>
      <a href="../coaches/index.html" class="nav-item"><i class="fa-solid fa-user-tie"></i><span>Coaches</span></a>
      <a href="../profile/index.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>
    <button class="sidebar-logout" id="logoutBtn">
      <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Log Out</span>
    </button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <div>
          <p class="topbar-greeting">Your account</p>
          <h2 class="topbar-name">Profile</h2>
        </div>
      </div>
      <a href="../profile/index.html" class="topbar-avatar" id="topbarAvatar"></a>
    </header>

    <div class="page-content">

      <!-- profile card -->
      <section class="profile-hero">
        <div class="profile-avatar-lg" id="profileInitials"></div>
        <div class="profile-hero-info">
          <h3 id="profileName">—</h3>
          <p id="profileEmail" class="profile-email">—</p>
          <p id="profileJoined" class="profile-joined">—</p>
        </div>
        <div class="profile-hero-stats">
          <div class="profile-hero-stat">
            <span id="profileSessions">0</span>
            <p>Sessions</p>
          </div>
          <div class="profile-hero-stat">
            <span id="profileStreak">0</span>
            <p>Streak</p>
          </div>
          <div class="profile-hero-stat">
            <span id="profileCalories">0</span>
            <p>Calories</p>
          </div>
          <div class="profile-hero-stat">
            <span id="profileMins">0</span>
            <p>Mins</p>
          </div>
        </div>
      </section>

      <div class="profile-grid">

        <!-- edit profile -->
        <section class="profile-card">
          <h4>Personal Info</h4>
          <div class="profile-form">
            <div class="profile-field">
              <label>Full Name</label>
              <input type="text" id="p-name" placeholder="Your name" />
            </div>
            <div class="profile-field">
              <label>Fitness Level</label>
              <select id="p-level">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
            <div class="profile-field">
              <label>Goal</label>
              <select id="p-goal">
                <option value="lose weight">Lose Weight</option>
                <option value="build muscle">Build Muscle</option>
                <option value="stay active">Stay Active</option>
                <option value="improve endurance">Improve Endurance</option>
              </select>
            </div>
            <div class="profile-field">
              <label>Equipment</label>
              <select id="p-equipment">
                <option value="none">No Equipment</option>
                <option value="basic">Basic (Dumbbells)</option>
                <option value="full gym">Full Gym</option>
              </select>
            </div>
            <div class="profile-field">
              <label>Days Per Week</label>
              <select id="p-days">
                <option value="3">3 Days</option>
                <option value="4">4 Days</option>
                <option value="5">5 Days</option>
                <option value="6">6 Days</option>
              </select>
            </div>
            <button class="btn profile-save-btn" id="saveProfileBtn" onclick="saveProfile()">
              Save Changes
            </button>
            <p class="profile-note" id="profileNote" style="display:none;"></p>
          </div>
        </section>

        <!-- change password -->
        <section class="profile-card">
          <h4>Security</h4>
          <div class="profile-form">
            <div class="profile-field">
              <label>Current Password</label>
              <input type="password" id="p-current-password" placeholder="••••••••" />
            </div>
            <div class="profile-field">
              <label>New Password</label>
              <input type="password" id="p-new-password" placeholder="Min 8 characters" />
            </div>
            <button class="btn profile-save-btn" id="changePasswordBtn" onclick="changePassword()">
              Update Password
            </button>
          </div>
        </section>

      </div>
    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="../../form/supabase/supabase.js"></script>
  <script src="./profile.js"></script>
</body>
</html>
