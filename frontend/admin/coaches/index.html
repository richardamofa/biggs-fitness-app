<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <title>Coaches — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../global.css"/>
  <link rel="stylesheet" href="../admin.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous"/>
</head>
<body>

<aside class="admin-sidebar">
  <div class="admin-logo">
   <!-- <span class="admin-logo-mark">B</span>-->
    <div>
      <span class="admin-logo-text">biggs <span>fitness</span></span>
      <span class="admin-badge">Admin</span>
    </div>
  </div>
  <nav class="admin-nav">
    <a href="../index.html"   class="admin-nav-item"><i class="fa-solid fa-gauge"></i><span>Dashboard</span></a>
    <a href="./coaches.html" class="admin-nav-item active"><i class="fa-solid fa-user-tie"></i><span>Coaches</span></a>
    <a href="../users/index.html"   class="admin-nav-item"><i class="fa-solid fa-users"></i><span>Users</span></a>
    <a href="../logs.html"    class="admin-nav-item"><i class="fa-solid fa-triangle-exclamation"></i><span>Error Logs</span></a>
  </nav>
  <div class="admin-sidebar-bottom">
    <a href="../../dashboard/index.html" class="admin-nav-item"><i class="fa-solid fa-arrow-left"></i><span>Back to App</span></a>
    <button class="admin-nav-item admin-logout" id="adminLogout"><i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span></button>
  </div>
</aside>

<main class="admin-main">
  <header class="admin-topbar">
    <div>
      <p class="admin-topbar-sub">Manage</p>
      <h2>Coaches</h2>
    </div>
    <button class="btn admin-add-btn" onclick="openModal()">
      <i class="fa-solid fa-plus"></i> Add Coach
    </button>
  </header>

  <div class="admin-content">
    <div class="admin-table-card">
      <div class="admin-table-header">
        <h3>All Coaches</h3>
        <input type="text" class="admin-search" id="coachSearch" placeholder="Search coaches..." oninput="filterCoaches()"/>
      </div>
      <table class="admin-table" id="coachesTable">
        <thead>
          <tr><th>Coach</th><th>Title</th><th>Tags</th><th>Rating</th><th>Price</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="coachesBody">
          <tr><td colspan="7" class="admin-loading">Loading coaches...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="admin-modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="admin-modal" onclick="event.stopPropagation()">
    <div class="admin-modal-header">
      <h3 id="modalTitle">Add Coach</h3>
      <button class="admin-modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form class="admin-modal-form" id="coachForm" onsubmit="saveCoach(event)">
      <input type="hidden" id="coachId"/>
      <div class="admin-form-row">
        <div class="admin-form-field">
          <label>Full Name *</label>
          <input type="text" id="coachName" placeholder="Kwame Asante" required/>
        </div>
        <div class="admin-form-field">
          <label>Title *</label>
          <input type="text" id="coachTitle" placeholder="Strength & Conditioning Coach" required/>
        </div>
      </div>
      <div class="admin-form-field">
        <label>Bio</label>
        <textarea id="coachBio" rows="3" placeholder="Short bio about the coach..."></textarea>
      </div>
      <div class="admin-form-row">
        <div class="admin-form-field">
          <label>Tags (comma separated)</label>
          <input type="text" id="coachTags" placeholder="muscle gain, beginner"/>
        </div>
        <div class="admin-form-field">
          <label>Emoji</label>
          <input type="text" id="coachEmoji" placeholder="💪" maxlength="4"/>
        </div>
      </div>
      <div class="admin-form-row">
        <div class="admin-form-field">
          <label>Price</label>
          <input type="text" id="coachPrice" placeholder="GH₵ 120"/>
        </div>
        <div class="admin-form-field">
          <label>Rating (0-5)</label>
          <input type="number" id="coachRating" placeholder="4.9" min="0" max="5" step="0.1"/>
        </div>
        <div class="admin-form-field">
          <label>Reviews count</label>
          <input type="number" id="coachReviews" placeholder="84" min="0"/>
        </div>
      </div>
      <div class="admin-form-row">
        <div class="admin-form-field">
          <label>WhatsApp number</label>
          <input type="text" id="coachWhatsapp" placeholder="233XXXXXXXXX"/>
        </div>
        <div class="admin-form-field">
          <label>Email</label>
          <input type="email" id="coachEmail" placeholder="coach@biggsfitness.com"/>
        </div>
        <div class="admin-form-field">
          <label>Phone</label>
          <input type="text" id="coachPhone" placeholder="+233 XX XXX XXXX"/>
        </div>
      </div>
      <div class="admin-form-field admin-form-check">
        <input type="checkbox" id="coachActive" checked/>
        <label for="coachActive">Active (visible to users)</label>
      </div>
      <p class="admin-form-note" id="coachFormNote" style="display:none;"></p>
      <div class="admin-modal-actions">
        <button type="button" class="btn-outline" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn" id="coachSaveBtn">Save Coach</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirm -->
<div class="admin-modal-overlay" id="deleteOverlay" onclick="closeDelete()">
  <div class="admin-modal admin-modal-sm" onclick="event.stopPropagation()">
    <h3>Delete Coach</h3>
    <p style="margin:1.6rem 0;color:rgba(240,237,232,0.55);font-size:1.4rem;">
      Are you sure you want to delete <strong id="deleteCoachName"></strong>? This cannot be undone.
    </p>
    <div class="admin-modal-actions">
      <button class="btn-outline" onclick="closeDelete()">Cancel</button>
      <button class="btn admin-delete-confirm-btn" id="deleteConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="../form/supabase/supabase.js"></script>
<script src="./admin.js"></script>
<script>
let allCoaches = [];
let deleteTargetId = null;

async function loadCoaches() {
  if (!await checkAdmin()) return;
  const { data, error } = await sb.from("coaches").select("*").order("created_at", { ascending: false });
  if (error) { console.error(error); return; }
  allCoaches = data || [];
  renderCoaches(allCoaches);
}

function renderCoaches(coaches) {
  const tbody = document.getElementById("coachesBody");
  if (!coaches.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="admin-empty">No coaches yet. Add one above.</td></tr>';
    return;
  }
  tbody.innerHTML = coaches.map(c => `
    <tr>
      <td>
        <div class="admin-coach-cell">
          <span class="admin-coach-emoji">${c.emoji || "💪"}</span>
          <span>${c.name}</span>
        </div>
      </td>
      <td class="admin-muted">${c.title || "—"}</td>
      <td>${(c.tags || []).map(t => `<span class="coach-tag">${t}</span>`).join("")}</td>
      <td>⭐ ${c.rating || 5.0} <span class="admin-muted">(${c.reviews || 0})</span></td>
      <td>${c.price || "—"}</td>
      <td>
        <span class="admin-status-badge ${c.active ? 'active' : 'inactive'}">
          ${c.active ? "Active" : "Inactive"}
        </span>
      </td>
      <td>
        <div class="admin-action-btns">
          <button class="admin-btn-icon edit" onclick="openModal('${c.id}')" title="Edit"><i class="fa-solid fa-pen"></i></button>
          <button class="admin-btn-icon toggle" onclick="toggleCoach('${c.id}', ${c.active})" title="${c.active ? 'Deactivate' : 'Activate'}">
            <i class="fa-solid fa-${c.active ? 'eye-slash' : 'eye'}"></i>
          </button>
          <button class="admin-btn-icon delete" onclick="confirmDelete('${c.id}', '${c.name}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
        </div>
      </td>
    </tr>
  `).join("");
}

function filterCoaches() {
  const q = document.getElementById("coachSearch").value.toLowerCase();
  renderCoaches(allCoaches.filter(c =>
    c.name?.toLowerCase().includes(q) ||
    c.title?.toLowerCase().includes(q) ||
    (c.tags || []).some(t => t.includes(q))
  ));
}

function openModal(id = null) {
  const overlay = document.getElementById("modalOverlay");
  const title   = document.getElementById("modalTitle");
  document.getElementById("coachForm").reset();
  document.getElementById("coachFormNote").style.display = "none";

  if (id) {
    const c = allCoaches.find(x => x.id === id);
    if (!c) return;
    title.textContent = "Edit Coach";
    document.getElementById("coachId").value       = c.id;
    document.getElementById("coachName").value     = c.name || "";
    document.getElementById("coachTitle").value    = c.title || "";
    document.getElementById("coachBio").value      = c.bio || "";
    document.getElementById("coachTags").value     = (c.tags || []).join(", ");
    document.getElementById("coachEmoji").value    = c.emoji || "💪";
    document.getElementById("coachPrice").value    = c.price || "";
    document.getElementById("coachRating").value   = c.rating || 5.0;
    document.getElementById("coachReviews").value  = c.reviews || 0;
    document.getElementById("coachWhatsapp").value = c.whatsapp || "";
    document.getElementById("coachEmail").value    = c.email || "";
    document.getElementById("coachPhone").value    = c.phone || "";
    document.getElementById("coachActive").checked = c.active;
  } else {
    title.textContent = "Add Coach";
    document.getElementById("coachId").value = "";
    document.getElementById("coachActive").checked = true;
  }

  overlay.classList.add("open");
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

async function saveCoach(e) {
  e.preventDefault();
  const btn  = document.getElementById("coachSaveBtn");
  const note = document.getElementById("coachFormNote");
  btn.textContent = "Saving...";
  btn.disabled    = true;

  const id = document.getElementById("coachId").value;
  const payload = {
    name:      document.getElementById("coachName").value.trim(),
    title:     document.getElementById("coachTitle").value.trim(),
    bio:       document.getElementById("coachBio").value.trim(),
    tags:      document.getElementById("coachTags").value.split(",").map(t => t.trim()).filter(Boolean),
    emoji:     document.getElementById("coachEmoji").value.trim() || "💪",
    price:     document.getElementById("coachPrice").value.trim(),
    rating:    parseFloat(document.getElementById("coachRating").value) || 5.0,
    reviews:   parseInt(document.getElementById("coachReviews").value) || 0,
    whatsapp:  document.getElementById("coachWhatsapp").value.trim(),
    email:     document.getElementById("coachEmail").value.trim(),
    phone:     document.getElementById("coachPhone").value.trim(),
    active:    document.getElementById("coachActive").checked,
  };

  let error;
  if (id) {
    ({ error } = await sb.from("coaches").update(payload).eq("id", id));
  } else {
    ({ error } = await sb.from("coaches").insert(payload));
  }

  if (error) {
    note.textContent   = "Error: " + error.message;
    note.style.display = "block";
    note.style.color   = "#ff2c2c";
  } else {
    closeModal();
    loadCoaches();
  }

  btn.textContent = "Save Coach";
  btn.disabled    = false;
}

async function toggleCoach(id, currentActive) {
  await sb.from("coaches").update({ active: !currentActive }).eq("id", id);
  loadCoaches();
}

function confirmDelete(id, name) {
  deleteTargetId = id;
  document.getElementById("deleteCoachName").textContent = name;
  document.getElementById("deleteOverlay").classList.add("open");
}

function closeDelete() {
  document.getElementById("deleteOverlay").classList.remove("open");
  deleteTargetId = null;
}

document.getElementById("deleteConfirmBtn").addEventListener("click", async () => {
  if (!deleteTargetId) return;
  await sb.from("coaches").delete().eq("id", deleteTargetId);
  closeDelete();
  loadCoaches();
});

loadCoaches();
</script>
</body>
</html>
