<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Plans — biggs fitness</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../global.css" />
  <link rel="stylesheet" href="../../dashboard/dashboard.css" />
  <link rel="stylesheet" href="./plan.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-label">biggs <span>fitness</span></span>
    </div>
    <nav class="sidebar-nav">
      <a href="../../dashboard/index.html" class="nav-item">
        <i class="fa-solid fa-house"></i><span>Dashboard</span>
      </a>
      <a href="../plans/index.html" class="nav-item active">
        <i class="fa-solid fa-calendar-days"></i><span>My Plans</span>
      </a>
      <a href="../workout/index.html" class="nav-item">
        <i class="fa-solid fa-dumbbell"></i><span>Workout</span>
      </a>
      <a href="../quick-suggestion/index.html" class="nav-item">
        <i class="fa-solid fa-bolt"></i><span>Quick Session</span>
      </a>
      <a href="../progress/index.html" class="nav-item">
        <i class="fa-solid fa-chart-line"></i><span>Progress</span>
      </a>
      <a href="../coaches/index.html" class="nav-item">
        <i class="fa-solid fa-user-tie"></i><span>Coaches</span>
      </a>
      <a href="../profile/index.html" class="nav-item">
        <i class="fa-solid fa-user"></i><span>Profile</span>
      </a>
    </nav>
    <button class="sidebar-logout" id="logoutBtn">
      <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Log Out</span>
    </button>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <div>
          <p class="topbar-greeting">Plan your week</p>
          <h2 class="topbar-name">My Plans</h2>
        </div>
      </div>
      <a href="../profile/index.html" class="topbar-avatar" id="topbarAvatar"></a>
    </header>

    <div class="page-content">

      <!-- generate form -->
      <section class="generate-section">
        <div class="generate-header">
          <div>
            <h3>Generate AI Plan</h3>
            <p class="generate-sub">Tell us about yourself and we'll build your weekly program.</p>
          </div>
        </div>

        <div class="generate-form">
          <div class="form-row">
            <div class="form-field">
              <label>Fitness Level</label>
              <select id="fitnessLevel">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
            <div class="form-field">
              <label>Goal</label>
              <select id="goal">
                <option value="lose weight">Lose Weight</option>
                <option value="build muscle">Build Muscle</option>
                <option value="stay active">Stay Active</option>
                <option value="improve endurance">Improve Endurance</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Equipment</label>
              <select id="equipment">
                <option value="none">No Equipment</option>
                <option value="basic">Basic (Dumbbells)</option>
                <option value="full gym">Full Gym</option>
              </select>
            </div>
            <div class="form-field">
              <label>Days Per Week</label>
              <select id="daysPerWeek">
                <option value="3">3 Days</option>
                <option value="4">4 Days</option>
                <option value="5">5 Days</option>
                <option value="6">6 Days</option>
              </select>
            </div>
          </div>
          <button class="btn generate-btn" id="generateBtn" onclick="generatePlan()">
            <i class="fa-solid fa-robot"></i> Generate My Plan
          </button>
        </div>

        <p class="plan-notification" id="planNotification" style="display:none;"></p>
      </section>

      <!-- current plan -->
      <section class="plan-section">
        <h3>Your Current Plan</h3>
        <div id="emptyState" class="empty-state">
          <i class="fa-solid fa-calendar-plus"></i>
          <p>No plan yet. Generate one above to get started.</p>
        </div>
        <div id="planContainer"></div>
      </section>

    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="../../form/supabase/supabase.js"></script>
  <script src="./plan.js"></script>
</body>
</html>
